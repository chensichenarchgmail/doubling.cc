<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="小花的建筑笔记：建筑、展览与公共生活的阅读、评论和研究札记。"
    />
    <meta name="robots" content="noindex, noarchive, nosnippet" />
    <title>小花的建筑笔记</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="site-title" href="/" aria-label="小花的建筑笔记首页">小花的建筑笔记</a>
        <span class="site-note">ARCHITECTURE NOTES</span>
      </header>

      <main>
        <section class="controls" aria-label="文章搜索与筛选">
          <div class="search-wrap">
            <label class="search-label" for="article-search" aria-hidden="true">⌕</label>
            <input
              class="search-input"
              id="article-search"
              type="search"
              placeholder="搜索标题、标签或文章内容"
              autocomplete="off"
              data-search
            />
            <button class="search-clear" type="button" data-search-clear>清除</button>
          </div>

          <div class="filter-row">
            <div class="filters" aria-label="文章分类">
              <button
                class="filter-button is-active"
                type="button"
                data-filter="全部"
                aria-pressed="true"
              >
                全部
              </button>
              <button class="filter-button" type="button" data-filter="评论" aria-pressed="false">
                评论
              </button>
              <button
                class="filter-button"
                type="button"
                data-filter="建筑师"
                aria-pressed="false"
              >
                建筑师
              </button>
              <button class="filter-button" type="button" data-filter="理论" aria-pressed="false">
                理论
              </button>
            </div>
            <a
              class="xhs-link"
              href="https://xhslink.cn/m/5hU8gL6OSXb"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="在新窗口打开小红书"
              >XHS ↗</a
            >
          </div>
        </section>

        <p class="result-count" aria-live="polite" data-result-count></p>

        <section class="article-list" aria-label="文章">
          <a
            class="article-card"
            href="/articles/poetics-of-survival-lina-bo-bardi/"
            data-article
          >
            <div class="article-meta">
              <time datetime="2026-07-26">2026.07.26</time>
              <span>评论</span>
            </div>
            <h1 class="article-card-title">
              “生存的诗学”，拒绝对贫困的浪漫化，关于 <span lang="en">Lina Bo Bardi</span>
              展览
            </h1>
            <p class="article-summary">
              从“生存的文明”到“生存的诗学”，重新追问展览如何把结构性贫困转化为可以欣赏的设计资源，以及劳动者的创造力应当通向什么。
            </p>
            <div class="article-tags" aria-label="标签">
              <span class="tag">Lina Bo Bardi</span>
              <span class="tag">展览批评</span>
              <span class="tag">贫困浪漫化</span>
              <span class="tag">生存的文明</span>
              <span class="tag">劳动</span>
              <span class="tag">公共性</span>
              <span class="tag">博物馆</span>
              <span class="tag">意识形态</span>
            </div>
          </a>

          <p class="empty-state" data-empty>没有找到匹配的文章。</p>
        </section>
      </main>

      <footer class="site-footer">
        <span>© 2026 小花的建筑笔记</span>
        <span>阅读、建筑与公共生活</span>
      </footer>
    </div>

    <script src="/assets/site.js" defer></script>
    <script src="/assets/protect.js" defer></script>
  </body>
</html>
