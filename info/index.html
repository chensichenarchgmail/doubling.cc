<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="欧洲建筑设计硕士项目检索与比较，面向 2027 秋季入学准备。" />
    <title>欧洲建筑硕士项目｜Doubling</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" data-home>DOUBLING<span>/INFO</span></a>
      <nav class="main-nav" aria-label="主导航">
        <a href="./" data-home>学校与项目</a>
        <button type="button" data-open-compare>项目比较 <span data-compare-count>0</span></button>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
    <div class="compare-dock" data-compare-dock hidden>
      <div class="compare-dock-inner">
        <div>
          <span class="eyebrow">项目比较</span>
          <strong data-dock-label>已选择 0 / 5</strong>
        </div>
        <div class="compare-mini-list" data-compare-mini></div>
        <button class="button button-dark" type="button" data-open-compare>开始比较 →</button>
      </div>
    </div>
    <footer class="site-footer">
      <span>欧洲建筑设计硕士 · 2027 入学准备</span>
      <span>信息更新于 2026.07.29</span>
    </footer>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
